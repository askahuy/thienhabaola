<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giả Lập Điện Thoại — THIÊN HÀ BAO LA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #06070d;
      color: #f3f0e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 14px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
    }
    .toolbar span {
      color: rgba(243,240,230,0.6);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-right: 4px;
    }
    .toolbar button {
      background: rgba(255,255,255,0.06);
      color: #f3f0e6;
      border: 1px solid rgba(255,255,255,0.14);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toolbar button.active, .toolbar button:hover {
      background: rgba(229, 193, 119, 0.18);
      border-color: #e5c177;
      color: #e5c177;
    }
    .phone-shell {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 48px;
      background: #000;
      padding: 12px;
      box-shadow:
        0 0 0 2px #2a2d3a,
        0 0 0 6px #12141d,
        0 25px 70px rgba(0,0,0,0.85);
      transition: width 0.25s ease, height 0.25s ease;
    }
    .notch {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 116px;
      height: 28px;
      background: #000;
      border-radius: 999px;
      z-index: 10;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }
    .home-bar {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: rgba(255,255,255,0.35);
      border-radius: 999px;
      z-index: 10;
      pointer-events: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 38px;
      background: #050508;
      display: block;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span>Khung máy:</span>
    <button class="active" onclick="setSize(390, 844, this)">iPhone 14/15 Pro (390×844)</button>
    <button onclick="setSize(375, 667, this)">iPhone SE (375×667)</button>
    <button onclick="setSize(430, 932, this)">iPhone Pro Max (430×932)</button>
    <button onclick="reloadFrame()">↻ Tải lại</button>
  </div>

  <div class="phone-shell" id="shell">
    <div class="notch"></div>
    <iframe id="frame" src="./index.html"></iframe>
    <div class="home-bar"></div>
  </div>

  <script>
    function setSize(w, h, btn) {
      const shell = document.getElementById('shell');
      shell.style.width = (w + 24) + 'px';
      shell.style.height = (h + 24) + 'px';
      document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }
    function reloadFrame() {
      const f = document.getElementById('frame');
      f.src = './index.html?t=' + Date.now();
    }
  </script>
</body>
</html>
